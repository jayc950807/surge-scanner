name: Reverify Positions

on:
  workflow_dispatch:

jobs:
  reverify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker --reverify
        # 저장소 루트에서 실행해야 data/ 폴더를 제대로 갱신한다 (core/ 에서 돌면 core/data 에 써짐)
        run: python core/tracker.py --reverify

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "reverify: position re-check"
          git push
