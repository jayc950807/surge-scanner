name: Simulation (봇 방식 재계산)
# 과거 신호를 지금 봇 방식(LOC 한도·익절 지정가·5분 손절·만기·수수료·나눠서 전부 투자)으로 1분봉 재계산 → data/sim_realistic.*
on:
  workflow_dispatch:
    inputs:
      stop_every:
        description: '손절 확인 간격(분)'
        required: false
        default: '1'
permissions:
  contents: write
env:
  ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
  ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
concurrency:
  group: scanner-push
  cancel-in-progress: false
jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python core/sim_realistic.py
        env:
          STOP_EVERY: ${{ github.event.inputs.stop_every || '1' }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sim_realistic*.csv data/sim_realistic*.json
          git diff --staged --quiet && exit 0
          git commit -m "sim: 봇 방식 재계산"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin main && exit 0; git rebase --abort 2>/dev/null || true; sleep 7; done
          exit 1
