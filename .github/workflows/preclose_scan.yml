name: Pre-close Scan (15:46 ET)
on:
  schedule:
    # 15:46 ET 에 돌아야 한다 (무료 Alpaca 는 15분 지연 → 15:30 까지의 가격으로 판정. 종가 주문 마감은 15:50).
    # GitHub 예약은 2~5시간 늦게 시작하는 일이 잦아서 13:03 ET 부터 10분마다 걸어 둔다. 각 실행은
    # 'ET 15:05~15:48 안이면 15:46 까지 기다렸다 스캔, 아니면 즉시 종료(10초)'. 이미 스캔했으면 건너뛴다.
    # 여름(EDT) 17~19시 UTC = 13~15시 ET, 겨울(EST) 18~20시 UTC = 13~15시 ET → 둘 다 걸고 스크립트가 ET 로 판단
    - cron: '3,13,23,33,43,53 17-20 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scanner-push
  cancel-in-progress: false
env:
  ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
  ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
jobs:
  preclose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Wait until 15:46 ET, then scan watchlist
        run: |
          python - <<'PY'
          import time, datetime as dt
          from zoneinfo import ZoneInfo
          ny = ZoneInfo("America/New_York")
          now = dt.datetime.now(ny)
          target = now.replace(hour=15, minute=46, second=0, microsecond=0)
          if now.hour != 15 or now.minute > 48:
              print(f"ET {now:%H:%M} — 15:00~15:48 ET 밖(다른 시간대 몫이거나 너무 늦음). 종료"); raise SystemExit(0)
          if now < target:
              wait = (target - now).total_seconds(); print(f"{wait/60:.0f}분 대기 → 15:46 ET"); time.sleep(wait)
          open("/tmp/go","w").write("1")
          PY
          if [ -f /tmp/go ]; then set -o pipefail; python core/scanner.py --preclose 2>&1 | tee preclose_output.log; fi
      - name: Bot — 2일 만기 종가 매도 + 새 신호 종가 매수 (BOT_MODE=live 일 때만 실제 주문)
        if: always()
        continue-on-error: true
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
          KIS_ENV: ${{ vars.KIS_ENV || 'real' }}
          BOT_MODE: ${{ vars.BOT_MODE || 'dry' }}
          BOT_PAUSE: ${{ vars.BOT_PAUSE || '0' }}
          BOT_POS_PCT: ${{ vars.BOT_POS_PCT || '10' }}
          BOT_MAX_POS: ${{ vars.BOT_MAX_POS || '10' }}
          BOT_START_EQUITY: ${{ vars.BOT_START_EQUITY || '0' }}
          BOT_MAX_DD: ${{ vars.BOT_MAX_DD || '15' }}
          BOT_START_DATE: ${{ vars.BOT_START_DATE || '' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: if [ -f /tmp/go ]; then python core/bot.py preclose; fi
      - name: Register signals (PENDING → 종가 진입은 아침 tracker 가 처리)
        run: if [ -f /tmp/go ]; then python core/tracker.py --register-only; fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: preclose-${{ github.run_id }}
          path: preclose_output.log
          retention-days: 14
          if-no-files-found: ignore
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "preclose: $(date +%Y-%m-%d) 15:30 ET signals"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 5))
          done
          exit 1
