name: Pre-close Scan (15:30 ET)
on:
  schedule:
    # GitHub 예약은 10~30분 늦게 시작할 수 있어 15:05 ET 에 걸고, 스크립트 안에서 15:30 ET 까지 기다린다.
    # 서머타임(3월 둘째 일~11월 첫째 일) 19:05 UTC / 겨울 20:05 UTC — 둘 다 걸고 스크립트가 ET 로 판단
    - cron: '5 19 * * 1-5'
    - cron: '25 19 * * 1-5'   # 첫 실행이 지연됐을 때 보조 (이미 실행됐으면 스크립트가 건너뜀)
    - cron: '5 20 * * 1-5'
    - cron: '25 20 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scanner-push
  cancel-in-progress: false
jobs:
  preclose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Wait until 15:30 ET, then scan watchlist
        run: |
          python - <<'PY'
          import time, datetime as dt
          from zoneinfo import ZoneInfo
          ny = ZoneInfo("America/New_York")
          now = dt.datetime.now(ny)
          target = now.replace(hour=15, minute=30, second=0, microsecond=0)
          if now.hour != 15 or now.minute > 48:
              print(f"ET {now:%H:%M} — 15:00~15:48 ET 밖(다른 시간대 몫이거나 너무 늦음). 종료"); raise SystemExit(0)
          if now < target:
              wait = (target - now).total_seconds(); print(f"{wait/60:.0f}분 대기 → 15:30 ET"); time.sleep(wait)
          open("/tmp/go","w").write("1")
          PY
          if [ -f /tmp/go ]; then set -o pipefail; python core/scanner.py --preclose 2>&1 | tee preclose_output.log; fi
      - name: Register signals (PENDING → 종가 진입은 아침 tracker 가 처리)
        run: if [ -f /tmp/go ]; then python core/tracker.py --register-only; fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: preclose-${{ github.run_id }}
          path: preclose_output.log
          retention-days: 14
          if-no-files-found: ignore
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "preclose: $(date +%Y-%m-%d) 15:30 ET signals"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 5))
          done
          exit 1
