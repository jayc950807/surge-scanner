name: Cache minute bars (분석용)
on:
  workflow_dispatch:
env:
  ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
  ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
permissions:
  contents: write
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python core/cache_minutes.py
      - name: Push to cache branch
        run: |
          cd /tmp/cache && git init -q -b cache && git add . \
            && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm cache \
            && git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} cache
