name: Daily Surge Scan
on:
  schedule:
    # 장 마감(16:00 ET) 직후 가능한 한 빨리. GitHub 예약은 정각(:00)에 몰려 2~5시간 늦게 시작하는 일이 잦아서
    # 어중간한 분에 여러 번 걸어 둔다. 스크립트가 '마감 16:20 ET 전이면 종료 / 오늘 이미 끝냈으면 종료'로 거른다 (한 번만 실제로 돈다).
    #   여름(EDT) 마감 20:00 UTC → 20:23·20:43·21:23 UTC = 한국 05:23·05:43·06:23
    #   겨울(EST) 마감 21:00 UTC → 21:23·21:43·22:23 UTC = 한국 06:23·06:43·07:23
    - cron: '23 20 * * 1-5'
    - cron: '43 20 * * 1-5'
    - cron: '23 21 * * 1-5'
    - cron: '43 21 * * 1-5'
    - cron: '23 22 * * 1-5'
    - cron: '23 23 * * 1-5'   # 그래도 안 됐으면 한국 08:23 에 한 번 더
  workflow_dispatch:
    inputs:
      reset_tracker:
        description: '포지션 전체 리셋 (YES 입력 시 초기화 후 재처리)'
        required: false
        default: ''
      reverify:
        description: '전체 히스토리 재검증 (YES 입력 시 모든 결과 재확인)'
        required: false
        default: ''
      rebuild_cache:
        description: '일봉 캐시를 지우고 Alpaca 에서 처음부터 다시 받기 (YES)'
        required: false
        default: ''
permissions:
  contents: write
env:
  ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
  ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
# 같은 워크플로우가 겹쳐서 돌지 않도록 직렬화 (이전 실행이 끝날 때까지 대기)
concurrency:
  group: scanner-push
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short 2>&1 || echo "⚠️ Some tests failed"
      - name: Run scanner (캐시 갱신 + 마감 뒤 전 종목 — 기록·대조용 + 내일 감시목록 갱신)
        id: scanner
        run: |
          if [ "${{ github.event.inputs.rebuild_cache }}" = "YES" ]; then
            python core/scanner.py --rebuild-cache 2>&1 | tee scanner_output.log
          else
            python core/scanner.py 2>&1 | tee scanner_output.log
          fi
          echo "scanner_exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
      - name: Run position tracker (스캐너가 실제로 돌았을 때만)
        if: steps.scanner.outcome == 'success'
        run: |
          if [ ! -f /tmp/scanned ] && [ "${{ github.event.inputs.reverify }}" != "YES" ] && [ "${{ github.event.inputs.reset_tracker }}" != "YES" ]; then
            echo "스캔이 돌지 않은 실행(장 마감 전이거나 오늘 이미 끝남) → 추적기 생략"; exit 0
          fi
          if [ "${{ github.event.inputs.reverify }}" = "YES" ]; then
            echo "🔄 전체 히스토리 재검증 모드"
            python core/tracker.py --reverify
          elif [ "${{ github.event.inputs.reset_tracker }}" = "YES" ]; then
            echo "🔄 포지션 전체 리셋 모드"
            python core/tracker.py --reset
          else
            python core/tracker.py
          fi
      - name: Bot — 실제 매매 기록 갱신 (조회만, 금액·수량 없음)
        if: always()
        continue-on-error: true
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
          KIS_ENV: ${{ vars.KIS_ENV || 'real' }}
          BOT_MODE: ${{ vars.BOT_MODE || 'dry' }}
        run: if [ -f data/live_trades.csv ]; then python core/bot.py record; fi
      - name: Summary
        if: always()
        run: |
          echo "### Scan Results 📊" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f scanner_output.log ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -20 scanner_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Signal files:**" >> $GITHUB_STEP_SUMMARY
          ls -la data/signal_*.csv 2>/dev/null | tail -5 >> $GITHUB_STEP_SUMMARY || echo "No signal files found" >> $GITHUB_STEP_SUMMARY
      - name: Commit and push results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "scan: $(date +%Y-%m-%d) signal + tracker update"
          # 다른 커밋이 먼저 올라갔을 경우를 대비해 rebase + 재시도
          for i in 1 2 3 4 5; do
            echo "Push attempt $i/5..."
            git pull --rebase origin main && git push origin main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 5))
          done
          echo "❌ Push failed after 5 attempts"
          exit 1
      - name: Upload scan artifact
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: scan-${{ github.run_id }}
          path: |
            data/signal_*.csv
            data/positions_*.csv
            scanner_output.log
          retention-days: 30
