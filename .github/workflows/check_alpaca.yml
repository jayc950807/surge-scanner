name: Check Alpaca Keys
# GitHub Secrets 에 넣은 ALPACA_KEY / ALPACA_SECRET 이 동작하는지 확인 (키 값은 절대 출력하지 않음). 수동 실행 전용.
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
      ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
    steps:
      - name: Secrets 이름 확인
        run: |
          python3 - <<'PY'
          import os, sys
          k = os.environ.get('ALPACA_KEY', '').strip(); s = os.environ.get('ALPACA_SECRET', '').strip()
          if not k or not s:
              print("✗ ALPACA_KEY / ALPACA_SECRET 이 비어 있음 — Settings → Secrets and variables → Actions 에 이름이 정확히 등록됐는지 확인"); sys.exit(1)
          print(f"✓ 두 키 모두 들어 있음 (ID {len(k)}자, Secret {len(s)}자 — 값은 표시하지 않음)")
          PY
      - name: 거래 API (clock·assets)
        run: |
          python3 - <<'PY'
          import os, sys, json, urllib.request
          H = {'APCA-API-KEY-ID': os.environ['ALPACA_KEY'], 'APCA-API-SECRET-KEY': os.environ['ALPACA_SECRET']}
          def get(url):
              r = urllib.request.Request(url, headers=H)
              with urllib.request.urlopen(r, timeout=60) as resp:
                  return json.loads(resp.read())
          host = None
          for h in ('https://paper-api.alpaca.markets', 'https://api.alpaca.markets'):
              try:
                  c = get(h + '/v2/clock'); host = h
                  print(f"✓ clock ({h.split('//')[1]}): is_open={c.get('is_open')} next_open={c.get('next_open')} next_close={c.get('next_close')}")
                  break
              except Exception as e:
                  print(f"  {h.split('//')[1]}: {str(e)[:120]}")
          if not host:
              print("✗ 거래 API 인증 실패 — 키 ID/Secret 이 서로 짝이 맞는지, 복사할 때 공백이 들어가지 않았는지 확인"); sys.exit(1)
          a = get(host + '/v2/assets?status=active&asset_class=us_equity')
          print(f"✓ assets: active {len(a)}개")
          PY
      - name: 시세 API (SPY 일봉·1분봉, 기업행위)
        run: |
          python3 - <<'PY'
          import os, sys, json, urllib.request, urllib.parse, datetime as dt
          from zoneinfo import ZoneInfo
          H = {'APCA-API-KEY-ID': os.environ['ALPACA_KEY'], 'APCA-API-SECRET-KEY': os.environ['ALPACA_SECRET']}
          def get(url, p):
              r = urllib.request.Request(url + '?' + urllib.parse.urlencode(p), headers=H)
              with urllib.request.urlopen(r, timeout=60) as resp:
                  return json.loads(resp.read())
          ny = ZoneInfo('America/New_York'); now = dt.datetime.now(ny); end = (now - dt.timedelta(minutes=16)).isoformat()
          ok = True
          try:
              j = get('https://data.alpaca.markets/v2/stocks/bars', {'symbols': 'SPY', 'timeframe': '1Day', 'start': (now - dt.timedelta(days=10)).strftime('%Y-%m-%d'), 'end': end, 'feed': 'sip', 'adjustment': 'raw', 'limit': 100})
              bars = j.get('bars', {}).get('SPY', [])
              print(f"✓ SPY 일봉(sip): {len(bars)}개, 마지막 {bars[-1]['t'][:10] if bars else '-'} close {bars[-1]['c'] if bars else '-'}")
          except Exception as e:
              ok = False; print(f"✗ SPY 일봉 실패: {str(e)[:160]}")
          try:
              j = get('https://data.alpaca.markets/v2/stocks/bars', {'symbols': 'SPY', 'timeframe': '1Min', 'start': (now - dt.timedelta(days=4)).strftime('%Y-%m-%d'), 'end': end, 'feed': 'sip', 'adjustment': 'raw', 'limit': 10000})
              bars = j.get('bars', {}).get('SPY', [])
              print(f"✓ SPY 1분봉(sip, 지금-16분까지): {len(bars)}개, 마지막 {bars[-1]['t'] if bars else '-'}")
          except Exception as e:
              ok = False; print(f"✗ SPY 1분봉 실패: {str(e)[:160]}")
          try:
              j = get('https://data.alpaca.markets/v1/corporate-actions', {'types': 'forward_split,reverse_split', 'start': (now - dt.timedelta(days=30)).strftime('%Y-%m-%d'), 'end': (now + dt.timedelta(days=10)).strftime('%Y-%m-%d'), 'limit': 1000})
              ca = j.get('corporate_actions', {}); n = sum(len(v) for v in ca.values())
              print(f"✓ 기업행위(분할·역분할, 최근 30일+예정 10일): {n}건")
          except Exception as e:
              ok = False; print(f"✗ 기업행위 실패: {str(e)[:160]}")
          print("\n결과:", "✓ 키 정상 — 스캐너·추적기가 쓸 수 있음" if ok else "✗ 문제 있음 (위 실패 항목 참고)")
          sys.exit(0 if ok else 1)
          PY
